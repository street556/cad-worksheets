<!doctype html> <!--Define o tipo de documento-->
<html lang="pt-pt"> <!--Define a linguagem do documento-->
	<head> <!--Cabeçalho-->
		<meta charset="utf-8"> <!--Codificação de caracteres-->
		<title>History</title> <!--Titulo do separador-->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!--Link para o ficheiro CSS do Bootstrap-->
	</head>
<body> <!--Corpo do documento-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"> <!--Navbar com fundo escuro e margem inferior de 4 unidades-->
        <div class="container-fluid"> <!--container-fluid é para ficar encostado à esquerda-->
            <a class="navbar-brand" href="">Home Sweet Home</a> <!--Marca da navbar-->
            <!--Botão para colapsar a navbar em dispositivos móveis-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span> <!--Icone do botão-->
            </button>
            <!--Itens da navbar que serão colapsados em dispositivos móveis-->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> <!--Alinha os itens à direita-->
                    <li class="nav-item"> <!--Item da navbar-->
                        <a class="nav-link" href="index.html">Dashboard</a> <!--Link para a página index.html-->
                    </li>
                    <li class="nav-item"> <!--Item da navbar-->
                        <a class="nav-link active" aria-current="page" href="history.html">History</a> <!--Link para a página history.html, com a classe "active" para indicar que é a página atual-->
                    </li>
                </ul>
            </div>
        </div>
</nav>
<div class="container my-5"> <!--Container com margem vertical de 5 unidades-->
        <div class="table-responsive shadow-sm bg-white rounded"> <!--Tabela responsiva com sombra, fundo branco e cantos arredondados-->
            <table class="table table-striped mb-0 align-middle"> <!--Tabela com linhas alternadas, sem margem inferior e alinhamento vertical ao meio-->
                <thead class="table-light"> <!--Cabeçalho da tabela com fundo claro-->
                    <tr>
                        <th scope="col" class="py-3">Category</th> <!--Cabeçalho da coluna "Category" com 3 pixeis de afastamento do topo e do fundo-->
                        <th scope="col" class="py-3">State</th> <!--Cabeçalho da coluna "State" com 3 pixeis de afastamento do topo e do fundo-->
                        <th scope="col" class="py-3">Last Changed</th> <!--Cabeçalho da coluna "Last Changed" com 3 pixeis de afastamento do topo e do fundo-->
                    </tr>
                </thead>
                <tbody> <!--Corpo da tabela-->
                    <tr> <!--Linha da tabela-->
                        <td>Kitchen lights</td> <!--Célula da coluna "Category" com o valor "Kitchen lights"-->
                        <td>Off</td> <!--Célula da coluna "State" com o valor "Off"-->
                        <td>23:40 2018-09-16</td> <!--Célula da coluna "Last Changed" com o valor "23:40 2018-09-16"-->
                    </tr>
                    <tr> <!--Linha da tabela-->
                        <td>Kitchen lights</td> <!--Célula da coluna "Category" com o valor "Kitchen lights"-->
                        <td>On</td> <!--Célula da coluna "State" com o valor "On"-->
                        <td>20:30 2018-09-16</td> <!--Célula da coluna "Last Changed" com o valor "20:30 2018-09-16"-->
                    </tr>
                    <tr> <!--Linha da tabela-->
                        <td>Weather</td> <!--Célula da coluna "Category" com o valor "Weather"-->
                        <td>Sunset</td> <!--Célula da coluna "State" com o valor "Sunset"-->
                        <td>20:35 2018-09-16</td> <!--Célula da coluna "Last Changed" com o valor "20:35 2018-09-16"-->
                    </tr>
                    <tr> <!--Linha da tabela-->
                        <td>Bell</td> <!--Célula da coluna "Category" com o valor "Bell"-->
                        <td>Ring</td>  <!--Célula da coluna "State" com o valor "Ring"-->
                        <td>19:30 2018-09-16</td> <!--Célula da coluna "Last Changed" com o valor "19:30 2018-09-16"-->
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>	
</html>
